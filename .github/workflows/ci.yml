name: QuestBridge checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Desktop and native checks
        run: |
          npm test
          cmake -S . -B build
          cmake --build build
          ctest --test-dir build --output-on-failure
          node tools/diagnostics/cross-language.mjs
          node tools/diagnostics/validate.mjs
          npm run demo
      - name: Install Android packages
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/questbridge-android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_USER_HOME="$RUNNER_TEMP/questbridge-android-user"
          mkdir -p "$ANDROID_HOME/cmdline-tools" "$ANDROID_USER_HOME"
          tools_zip="$RUNNER_TEMP/android-commandlinetools.zip"
          curl --fail --location --retry 3 -o "$tools_zip" https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          printf '7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee  %s\n' "$tools_zip" | sha256sum --check
          unzip -q "$tools_zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/19.0"
          export PATH="$ANDROID_HOME/cmdline-tools/19.0/bin:$PATH"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\nANDROID_USER_HOME=%s\n' "$ANDROID_HOME" "$ANDROID_HOME" "$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          sdk_result=${PIPESTATUS[1]}
          set -o pipefail
          test "$sdk_result" -eq 0
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build and lint Android runtime probe
        run: tools/build/android.sh
      - name: Retain probe APK and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: questbridge-probe-debug
          path: |
            headset/android-openxr/app/build/outputs/apk/debug/*.apk
            headset/android-openxr/app/build/reports/lint-results-debug.*
            build/Testing/Temporary/LastTest.log
