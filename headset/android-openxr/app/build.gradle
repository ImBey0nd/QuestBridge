plugins { id 'com.android.application' }
android {
 namespace 'org.questbridge.probe'
 compileSdk 35
 ndkVersion '27.2.12479018'
 defaultConfig {
  applicationId 'org.questbridge.probe'
  minSdk 29
  targetSdk 32
  versionCode 1
  versionName '0.1.0-probe'
  ndk { abiFilters 'arm64-v8a' }
  externalNativeBuild { cmake { cppFlags '-std=c++17' } }
 }
 buildFeatures { prefab true }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
}
dependencies { implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.65' }
